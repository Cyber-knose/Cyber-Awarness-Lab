<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Security</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#1b1b1b;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #00ff66;
}

h2{
    text-align:center;
    color:#00ff66;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
}

button{
    margin-top:10px;
    padding:10px;
    width:100%;
    cursor:pointer;
}

.bar{
    width:100%;
    height:12px;
    background:#333;
    margin-top:15px;
    border-radius:10px;
}

.fill{
    height:100%;
    width:0%;
    background:red;
    border-radius:10px;
    transition:.3s;
}

ul{
    margin-top:15px;
}

li{
    margin:5px 0;
}

</style>

</head>
<body>

<div class="container">

<h2>Password Security</h2>

<input type="password" id="password" placeholder="Enter Password">

<button onclick="togglePassword()">Show / Hide</button>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<h3 id="strength">Strength : -</h3>

<p><b>Estimated Crack Time:</b> <span id="crack">-</span></p>

<ul>
<li id="len">❌ Minimum 8 characters</li>
<li id="upper">❌ Uppercase Letter</li>
<li id="lower">❌ Lowercase Letter</li>
<li id="number">❌ Number</li>
<li id="symbol">❌ Special Character</li>
</ul>

</div>

<script>

const password=document.getElementById("password");

password.addEventListener("input",checkPassword);

function togglePassword(){

password.type=password.type==="password"?"text":"password";

}

function checkPassword(){

let p=password.value;

let score=0;

const length=p.length>=8;
const upper=/[A-Z]/.test(p);
const lower=/[a-z]/.test(p);
const number=/[0-9]/.test(p);
const symbol=/[^A-Za-z0-9]/.test(p);

update("len",length);
update("upper",upper);
update("lower",lower);
update("number",number);
update("symbol",symbol);

if(length) score+=20;
if(upper) score+=20;
if(lower) score+=20;
if(number) score+=20;
if(symbol) score+=20;

let fill=document.getElementById("fill");
let strength=document.getElementById("strength");
let crack=document.getElementById("crack");

fill.style.width=score+"%";

if(score<=20){
fill.style.background="red";
strength.innerHTML="Strength : Very Weak";
crack.innerHTML="Seconds";
}
else if(score<=40){
fill.style.background="orange";
strength.innerHTML="Strength : Weak";
crack.innerHTML="Minutes";
}
else if(score<=60){
fill.style.background="yellow";
strength.innerHTML="Strength : Medium";
crack.innerHTML="Hours";
}
else if(score<=80){
fill.style.background="cyan";
strength.innerHTML="Strength : Strong";
crack.innerHTML="Months";
}
else{
fill.style.background="lime";
strength.innerHTML="Strength : Very Strong";
crack.innerHTML="Years+";
}

}

function update(id,status){

document.getElementById(id).innerHTML=
(status?"✅ ":"❌ ")+document.getElementById(id).innerHTML.substring(2);

}

</script>

</body>
</html>
